<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 380" width="440" height="380">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FF9DD0"/>
      <stop offset="100%" stop-color="#FF6FB3"/>
    </radialGradient>

    <!-- Letter fill gradient -->
    <radialGradient id="letterFill" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFD6EC"/>
      <stop offset="40%" stop-color="#FFAAD8"/>
      <stop offset="100%" stop-color="#FF7EC3"/>
    </radialGradient>

    <!-- Sparkle shimmer gradient -->
    <radialGradient id="shimmer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFD6EC" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow filter -->
    <filter id="letterShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#C0307A" flood-opacity="0.5"/>
    </filter>

    <!-- Glow filter for sparkles -->
    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Letter clip path for inner texture -->
    <clipPath id="chimClip">
      <text x="220" y="175" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Nunito', Arial" font-size="132" font-weight="900" letter-spacing="8">CHIM</text>
    </clipPath>
    <clipPath id="chamClip">
      <text x="220" y="310" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Nunito', Arial" font-size="132" font-weight="900" letter-spacing="8">CHAM</text>
    </clipPath>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="440" height="380" rx="24" fill="url(#bgGrad)"/>

  <!-- Background decorative hearts -->
  <g opacity="0.25" fill="none" stroke="#ffffff" stroke-width="1.5">
    <!-- Top left hearts -->
    <path d="M32,28 C32,22 26,18 20,22 C14,18 8,22 8,28 C8,34 20,44 20,44 C20,44 32,34 32,28Z"/>
    <path d="M60,55 C60,51 56,49 52,51 C48,49 44,51 44,55 C44,59 52,65 52,65 C52,65 60,59 60,55Z"/>
    <!-- Top right hearts -->
    <path d="M420,28 C420,22 414,18 408,22 C402,18 396,22 396,28 C396,34 408,44 408,44 C408,44 420,34 420,28Z"/>
    <path d="M390,60 C390,56 386,54 382,56 C378,54 374,56 374,60 C374,64 382,70 382,70 C382,70 390,64 390,60Z"/>
    <!-- Bottom left hearts -->
    <path d="M38,340 C38,334 32,330 26,334 C20,330 14,334 14,340 C14,346 26,356 26,356 C26,356 38,346 38,340Z"/>
    <!-- Bottom right hearts -->
    <path d="M416,345 C416,339 410,335 404,339 C398,335 392,339 392,345 C392,351 404,361 404,361 C404,361 416,351 416,345Z"/>
    <!-- Middle left -->
    <path d="M20,190 C20,184 14,180 8,184 C2,180 -4,184 -4,190 C-4,196 8,206 8,206 C8,206 20,196 20,190Z"/>
    <!-- Middle right -->
    <path d="M446,190 C446,184 440,180 434,184 C428,180 422,184 422,190 C422,196 434,206 434,206 C434,206 446,196 446,190Z"/>
  </g>

  <!-- Background sparkle crosses -->
  <g opacity="0.3" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round">
    <line x1="75" y1="30" x2="75" y2="46"/><line x1="67" y1="38" x2="83" y2="38"/>
    <line x1="365" y1="340" x2="365" y2="356"/><line x1="357" y1="348" x2="373" y2="348"/>
    <line x1="410" y1="100" x2="410" y2="112"/><line x1="404" y1="106" x2="416" y2="106"/>
    <line x1="28" y1="260" x2="28" y2="272"/><line x1="22" y1="266" x2="34" y2="266"/>
    <line x1="200" y1="355" x2="200" y2="369"/><line x1="193" y1="362" x2="207" y2="362"/>
  </g>

  <!-- ===== CHIM text ===== -->
  <!-- Stroke / outline layer (dark pink) -->
  <text
    x="220" y="175"
    text-anchor="middle"
    font-family="'Arial Rounded MT Bold', 'Nunito', Arial"
    font-size="132"
    font-weight="900"
    letter-spacing="8"
    fill="none"
    stroke="#C0307A"
    stroke-width="10"
    stroke-linejoin="round"
    paint-order="stroke"
  >CHIM</text>

  <!-- Main fill layer -->
  <text
    x="220" y="175"
    text-anchor="middle"
    font-family="'Arial Rounded MT Bold', 'Nunito', Arial"
    font-size="132"
    font-weight="900"
    letter-spacing="8"
    fill="url(#letterFill)"
    filter="url(#letterShadow)"
  >CHIM</text>

  <!-- Glitter dots inside CHIM letters -->
  <g clip-path="url(#chimClip)" fill="white" opacity="0.55">
    <circle cx="90" cy="130" r="3.5"/><circle cx="108" cy="155" r="2"/><circle cx="75" cy="162" r="2.5"/>
    <circle cx="140" cy="120" r="2"/><circle cx="160" cy="148" r="3"/><circle cx="148" cy="172" r="2"/>
    <circle cx="195" cy="135" r="2.5"/><circle cx="210" cy="158" r="3.5"/><circle cx="185" cy="168" r="2"/>
    <circle cx="240" cy="125" r="3"/><circle cx="255" cy="150" r="2"/><circle cx="245" cy="168" r="3"/>
    <circle cx="285" cy="138" r="2.5"/><circle cx="298" cy="155" r="3.5"/><circle cx="270" cy="170" r="2"/>
    <circle cx="330" cy="130" r="2"/><circle cx="348" cy="152" r="3"/><circle cx="340" cy="170" r="2.5"/>
    <circle cx="365" cy="142" r="2"/><circle cx="115" cy="140" r="3"/><circle cx="222" cy="170" r="2.5"/>
    <circle cx="178" cy="145" r="2"/><circle cx="314" cy="145" r="2"/><circle cx="100" cy="170" r="3"/>
  </g>

  <!-- Shine highlight on CHIM -->
  <text
    x="215" y="158"
    text-anchor="middle"
    font-family="'Arial Rounded MT Bold', 'Nunito', Arial"
    font-size="132"
    font-weight="900"
    letter-spacing="8"
    fill="white"
    opacity="0.12"
    clip-path="url(#chimClip)"
  >CHIM</text>

  <!-- ===== CHAM text ===== -->
  <!-- Stroke / outline layer -->
  <text
    x="220" y="310"
    text-anchor="middle"
    font-family="'Arial Rounded MT Bold', 'Nunito', Arial"
    font-size="132"
    font-weight="900"
    letter-spacing="8"
    fill="none"
    stroke="#C0307A"
    stroke-width="10"
    stroke-linejoin="round"
    paint-order="stroke"
  >CHAM</text>

  <!-- Main fill layer -->
  <text
    x="220" y="310"
    text-anchor="middle"
    font-family="'Arial Rounded MT Bold', 'Nunito', Arial"
    font-size="132"
    font-weight="900"
    letter-spacing="8"
    fill="url(#letterFill)"
    filter="url(#letterShadow)"
  >CHAM</text>

  <!-- Glitter dots inside CHAM letters -->
  <g clip-path="url(#chamClip)" fill="white" opacity="0.55">
    <circle cx="88" cy="268" r="3.5"/><circle cx="105" cy="292" r="2"/><circle cx="74" cy="298" r="2.5"/>
    <circle cx="138" cy="258" r="2"/><circle cx="155" cy="284" r="3"/><circle cx="145" cy="308" r="2"/>
    <circle cx="193" cy="272" r="2.5"/><circle cx="208" cy="295" r="3.5"/><circle cx="182" cy="305" r="2"/>
    <circle cx="238" cy="262" r="3"/><circle cx="252" cy="288" r="2"/><circle cx="242" cy="305" r="3"/>
    <circle cx="283" cy="275" r="2.5"/><circle cx="296" cy="292" r="3.5"/><circle cx="268" cy="308" r="2"/>
    <circle cx="330" cy="268" r="2"/><circle cx="347" cy="290" r="3"/><circle cx="338" cy="308" r="2.5"/>
    <circle cx="363" cy="280" r="2"/><circle cx="113" cy="278" r="3"/><circle cx="220" cy="307" r="2.5"/>
    <circle cx="176" cy="283" r="2"/><circle cx="313" cy="282" r="2"/><circle cx="98" cy="308" r="3"/>
  </g>

  <!-- Shine highlight on CHAM -->
  <text
    x="215" y="293"
    text-anchor="middle"
    font-family="'Arial Rounded MT Bold', 'Nunito', Arial"
    font-size="132"
    font-weight="900"
    letter-spacing="8"
    fill="white"
    opacity="0.12"
    clip-path="url(#chamClip)"
  >CHAM</text>

  <!-- Sparkle stars scattered around the logo -->
  <g fill="white" filter="url(#sparkleGlow)">
    <!-- 4-point stars -->
    <!-- Star at top-left of CHIM -->
    <polygon points="55,68 58,80 70,83 58,86 55,98 52,86 40,83 52,80" opacity="0.9"/>
    <!-- Star at top-right of CHIM -->
    <polygon points="378,58 380,68 390,70 380,72 378,82 376,72 366,70 376,68" opacity="0.85"/>
    <!-- Star at right of CHIM -->
    <polygon points="405,140 407,148 415,150 407,152 405,160 403,152 395,150 403,148" opacity="0.8"/>
    <!-- Star at left of CHAM -->
    <polygon points="38,245 40,253 48,255 40,257 38,265 36,257 28,255 36,253" opacity="0.85"/>
    <!-- Star at bottom-right of CHAM -->
    <polygon points="398,298 400,308 410,310 400,312 398,322 396,312 386,310 396,308" opacity="0.9"/>
    <!-- Small stars -->
    <polygon points="120,48 122,54 128,56 122,58 120,64 118,58 112,56 118,54" opacity="0.75"/>
    <polygon points="300,345 302,351 308,353 302,355 300,361 298,355 292,353 298,351" opacity="0.75"/>
    <polygon points="25,130 26.5,135 32,136.5 26.5,138 25,143 23.5,138 18,136.5 23.5,135" opacity="0.65"/>
    <polygon points="415,220 416.5,225 422,226.5 416.5,228 415,233 413.5,228 408,226.5 413.5,225" opacity="0.65"/>
  </g>

  <!-- Small dot sparkles -->
  <g fill="white" opacity="0.7">
    <circle cx="55" cy="200" r="2.5"/><circle cx="385" cy="185" r="3"/>
    <circle cx="220" cy="28" r="2.5"/><circle cx="220" cy="355" r="2.5"/>
    <circle cx="152" cy="52" r="2"/><circle cx="305" cy="42" r="2"/>
    <circle cx="135" cy="345" r="2"/><circle cx="290" cy="352" r="2"/>
  </g>
</svg>
